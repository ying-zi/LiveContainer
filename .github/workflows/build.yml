name: Xcode - Build

on: 
  push:
  pull_request:
  workflow_dispatch:
    inputs: 
      release__nightly:
        description: Create a nightly release
        type: boolean
        required: false

jobs:
  build:
    name: Build using xcodebuild command
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      scheme: ${{ steps.scheme.outputs.scheme }}
      archive_path: ${{ env.archive_path }}
      artifact: ${{ env.scheme }}.ipa
      artifact2: ${{ env.scheme }}+SideStore.ipa
    steps:
      - name: Checkout code
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          cd $GITHUB_WORKSPACE
          # Clone the repo with the specific commit
          git clone "https://github.com/${{ github.repository }}.git" .
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout ${{ github.sha }}
          echo "Files after checkout:"
          ls -la
          echo "Submodules:"
          git submodule update --init --recursive 2>&1 || echo "No submodules or update failed"

      - name: Check Xcode version
        run: |
          echo "=== Default Xcode ==="
          xcodebuild -version || echo "No xcodebuild"
          echo "=== All Xcodes ==="
          ls /Applications/ | grep -i xcode || echo "None in /Applications"
          echo "=== Swift version ==="
          swift --version 2>/dev/null || echo "No swift"
          echo "=== SDKs ==="
          xcrun --showsdks 2>/dev/null | head -20 || true

      - name: Set Scheme
        id: scheme
        run: |
          if [ "$scheme" = "default" ]; then
            scheme_list=$(xcodebuild -list -json | tr -d "\n")
            scheme=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          fi
          echo "Using scheme: $scheme"
          echo "scheme=$scheme" >> $GITHUB_OUTPUT

      - name: Set filetype_parameter
        id: filetype_parameter
        run: |
          filetype_parameter=$(ls -A | grep -i '\.xcworkspace$' && echo workspace || echo project)
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT

      - name: Set file_to_build
        id: file_to_build
        run: |
          echo "=== Current dir: $GITHUB_WORKSPACE ==="
          cd $GITHUB_WORKSPACE
          ls -la *.xcworkspace 2>/dev/null || echo "No xcworkspace"
          ls -la *.xcodeproj 2>/dev/null || echo "No xcodeproj"
          echo "=== All files ==="
          ls -la
          file_to_build=$(find . -maxdepth 1 -name "*.xcworkspace" -o -name "*.xcodeproj" | head -1)
          if [ -z "$file_to_build" ]; then
            echo "ERROR: No workspace or project found!"
            exit 1
          fi
          file_to_build=$(basename "$file_to_build")
          if echo "$file_to_build" | grep -q "xcworkspace"; then
            filetype_parameter="workspace"
          else
            filetype_parameter="project"
          fi
          echo "Found: $filetype_parameter $file_to_build"
          echo "filetype_parameter=$filetype_parameter" >> $GITHUB_OUTPUT
          echo "file_to_build=$file_to_build" >> $GITHUB_OUTPUT

      - name: Archive
        env:
          scheme: ${{ steps.scheme.outputs.scheme }}
          filetype_parameter: ${{ steps.filetype_parameter.outputs.filetype_parameter }}
          file_to_build: ${{ steps.file_to_build.outputs.file_to_build }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -archivePath "$archive_path" \
            -scheme "$scheme" \
            -"$filetype_parameter" "$file_to_build" \
            -sdk iphoneos \
            -arch arm64 \
            -configuration Release

      - name: Tar Build Artifact
        run: tar -cvf "$archive_path.xcarchive.tar" "$archive_path.xcarchive"

      - name: Create IPA
        run: |
          sh .github/build_github.sh

      - name: Publish IPA Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -lh *.ipa
          TAG="ipa-latest"
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" LiveContainer.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LiveContainer 纯净版 (构建 #${GITHUB_RUN_NUMBER})" \
            --notes "自动构建 commit ${GITHUB_SHA:0:7}，运行 ${GITHUB_RUN_ID}" || exit 1
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size)"'
