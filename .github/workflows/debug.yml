name: Debug Runner
on: push
jobs:
  debug:
    runs-on: macos-latest
    steps:
      - run: |
          echo "Runner OS:"
          sw_vers
          echo "Architecture:"
          uname -m
          echo "Xcode versions:"
          ls /Applications/ | grep -i xcode || echo "No Xcode apps found"
          echo "xcodebuild:"
          xcodebuild -version 2>/dev/null || echo "No xcodebuild"
